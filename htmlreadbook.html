<!DOCTYPE html>
<html>
    <head>
        <title>My first HTML readbook</title>
    </head>
    <body>
        <h1>Мой первый учебник HTML</h1>
        <p>
            HTML — это <em>язык разметки</em>.
        </p>
        <p>
            <strong>ВАЖНО: HTML отвечает за структуру страницы.</strong>
        </p>
        <p>
            Сегодня я изучаю <mark>HTML</mark>.
        </p>
        <p>
            Цитата:<br>
            <blockquote>HTML описывает структуру документа.</blockquote>
        </p>
        <p>
            Пример:<br>
            <code>&lt;p&gt;Hello&lt;/p&gt;</code>
        </p>
        <p>
            Примечание:<br>
            <small>Это мой первый учебный документ.</small>
        </p>
    </body>
</html>
