<!DOCTYPE html>
<html>
    <head>
        <title>Schedule table</title>
    </head>
    <body>
        <h1>Моё расписание</h1>
        <h2>Расписание занятий</h2>

        <table>
            <thead>
                <tr>
                    <th>День</th>
                    <th>Тема</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Понедельник</td>
                    <td>HTML-таблицы</td>
                    <td>Завершено</td>
                </tr>
                <tr>
                    <td>Вторник</td>
                    <td>HTML-формы</td>
                    <td>В планах</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
